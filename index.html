<!DOCTYPE html>
<html lang="uk">
<head>
<script src="config.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хвиля: уся музика в одному місці</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0718;--sf:#1b1030;--sf2:#2d1850;--tx:#f4eaff;--mut:#ae95d6;--acc:#b23cff;--on-acc:#ffffff;
  --sc:#ff7a33;--au:#c08cff;--ja:#38d6b8;
  --disp:'Unbounded','Trebuchet MS',sans-serif;--body:'Onest','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0718;--sf:#1b1030;--sf2:#2d1850;--tx:#f4eaff;--mut:#ae95d6;--acc:#b23cff;--on-acc:#ffffff;color-scheme:dark;}}
:root[data-theme="light"]{--bg:#f3e8ff;--sf:#ffffff;--sf2:#e2cdfb;--tx:#2a1448;--mut:#6d4fa0;--acc:#9b22e8;--on-acc:#ffffff;color-scheme:light}
:root[data-theme="dark"]{--bg:#0f0718;--sf:#1b1030;--sf2:#2d1850;--tx:#f4eaff;--mut:#ae95d6;--acc:#b23cff;--on-acc:#ffffff;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(circle at 85% -5%,rgba(170,60,255,.45),transparent 50%),radial-gradient(circle at 0% 45%,rgba(255,40,140,.16),transparent 45%),var(--bg);background-attachment:fixed;color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.4;padding-bottom:170px;max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{padding:20px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mascot{width:78px;height:78px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 3px var(--acc),0 0 24px var(--acc)}
.mascot svg{display:block;width:100%;height:100%}
h1{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:-.02em;text-shadow:0 0 18px var(--acc)}
header p{color:var(--mut);margin-top:2px}
.search{margin:14px 20px 10px;display:flex;align-items:center;gap:10px;background:var(--sf);border-radius:16px;padding:0 14px}
.search svg{width:20px;height:20px;fill:none;stroke:var(--mut);stroke-width:2;flex:none}
.search input{flex:1;background:none;border:0;color:var(--tx);font:inherit;padding:14px 0;min-width:0}
.search input::placeholder{color:var(--mut)}
.chips{display:flex;gap:8px;padding:0 20px 8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:var(--sf);color:var(--mut);font-weight:500}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--acc))}
.chip[aria-pressed="true"]{background:var(--sf2);color:var(--tx);box-shadow:inset 0 0 0 2px var(--c,var(--acc))}
.hint{padding:2px 20px 8px;color:var(--mut);font-size:13px}
.list{padding:0 12px}
.row{display:flex;align-items:center;border-radius:14px;position:relative}
.row.on{background:var(--sf)}
.row .main{flex:1;display:flex;align-items:center;gap:12px;padding:9px 6px 9px 14px;text-align:left;min-width:0}
.row::before{content:"";position:absolute;left:3px;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--c)}
.cov{width:48px;height:48px;border-radius:12px;flex:none;overflow:hidden;display:block}
.cov svg{display:block;width:100%;height:100%}
.meta{display:flex;flex-direction:column;min-width:0;flex:1}
.meta b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.add{width:44px;height:44px;display:grid;place-items:center;color:var(--mut)}
.add svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.add.done{color:var(--acc)}
.empty{padding:40px 24px;text-align:center;color:var(--mut)}
.sec{font-family:var(--disp);font-size:15px;font-weight:500;padding:18px 20px 8px}
.pl{display:flex;gap:14px;align-items:center;margin:0 20px 10px;padding:12px;border-radius:16px;background:var(--sf);width:calc(100% - 40px);text-align:left}
.pl .cov{width:56px;height:56px}
.pl .srcs{display:flex;gap:4px;margin-top:5px}
.pl .srcs i{width:18px;height:6px;border-radius:3px;background:var(--c)}
.mini{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;background:var(--sf2);border-radius:18px;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;overflow:hidden;z-index:5}
.mini .tap{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.disc{width:46px;height:46px;border-radius:50%;flex:none;position:relative;background:conic-gradient(#111 0 12%,#2a2a2a 12% 25%,#111 25% 37%,#2a2a2a 37% 50%,#111 50% 62%,#2a2a2a 62% 75%,#111 75% 87%,#2a2a2a 87%);display:grid;place-items:center}
.disc .cov{width:42%;height:42%;border-radius:50%}
.disc::after{content:"";position:absolute;width:6%;height:6%;border-radius:50%;background:var(--bg)}
.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.pbtn{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;flex:none;box-shadow:0 0 16px var(--acc)}
.pbtn svg,.ctl svg{width:22px;height:22px;fill:currentColor}
.mbar{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:12px;font-weight:500}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--acc)}
.full{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 28px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.full.open{display:flex}
.full .close{align-self:flex-start;padding:10px 12px;margin-left:-12px;color:var(--mut)}
.big{width:min(78vw,320px);aspect-ratio:1;margin:18px 0 26px}
.big .cov{box-shadow:0 0 0 3px #000}
.full h2{font-family:var(--disp);font-size:21px;font-weight:700;text-align:center;letter-spacing:-.01em}
.full .art{color:var(--mut);margin-top:4px}
.tag{margin-top:12px;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:var(--sf);font-size:13px}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.seek{width:100%;margin-top:26px}
.seek input{width:100%;accent-color:var(--acc)}
.times{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.ctls{display:flex;align-items:center;gap:26px;margin-top:18px}
.ctl{width:54px;height:54px;display:grid;place-items:center;border-radius:50%}
.ctls .pbtn{width:72px;height:72px}
.ctls .pbtn svg{width:30px;height:30px}
.demo{margin-top:22px;color:var(--mut);font-size:12px;text-align:center}
body::before{content:"音楽　夜の波　聴いて";position:fixed;right:5px;top:130px;writing-mode:vertical-rl;font-family:'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif;font-weight:700;font-size:15px;letter-spacing:.35em;color:var(--acc);opacity:.4;pointer-events:none;z-index:-1}
.jps{font-family:'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif;font-weight:700;font-size:12px;letter-spacing:.25em;color:var(--acc);margin-top:6px}
</style>
</head>
<style>
.cov{position:relative}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.chip.soon{opacity:.5}
.add.fav.done{color:#ff4f9a}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--sf2);color:var(--tx);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90%;text-align:center}
</style>
<body>
<header>
  <div><h1>Хвиля</h1><p>Що послухаємо цієї ночі?</p><div class="jps">夜の音楽、どこでも</div></div>
  <span class="mascot" id="mascot"></span>
</header>

<main id="screen"></main>

<div class="mini" id="mini">
  <button class="tap" id="miniTap" aria-label="Відкрити плеєр">
    <span class="disc" id="miniDisc"><span class="cov" id="miniCov"></span></span>
    <span class="meta"><b id="miniT"></b><span id="miniA"></span></span>
  </button>
  <button class="pbtn" id="miniPlay" aria-label="Грати або пауза"></button>
  <div class="mbar" id="mbar"></div>
</div>

<nav><div class="in">
  <button data-tab="search" aria-current="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Пошук</button>
  <button data-tab="queue"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h9"/></svg>Черга</button>
  <button data-tab="lib"><svg viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 6l5 14"/></svg>Збірки</button>
</div></nav>

<section class="full" id="full" aria-label="Плеєр">
  <button class="close" id="close">Згорнути</button>
  <div class="disc big" id="bigDisc"><span class="cov" id="bigCov"></span></div>
  <h2 id="fT"></h2>
  <div class="art" id="fA"></div>
  <div class="jps">いま再生中</div>
  <div class="tag"><i id="fDot"></i><span id="fS"></span></div>
  <div class="seek">
    <input type="range" id="seek" min="0" value="0" aria-label="Перемотування">
    <div class="times"><span id="tNow">0:00</span><span id="tEnd">0:00</span></div>
  </div>
  <div class="ctls">
    <button class="ctl" id="prev" aria-label="Попередній"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="pbtn" id="fPlay" aria-label="Грати або пауза"></button>
    <button class="ctl" id="next" aria-label="Наступний"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>
</section>
<script>
const $=id=>document.getElementById(id);
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const girl=h=>{
 const hu=270+(h%5)*14,hc=`hsl(${hu} 45% ${16+(h%4)*4}%)`,hd=`hsl(${hu} 50% 9%)`,ic=['#ffd23f','#ff3d7f','#c15cff','#38f0ff'][h%4],bg=`hsl(${260+(h%6)*12} 70% 22%)`,v=h%3;
 const tails=v===1?`<path d="M22 40C2 58 6 94 22 98C16 80 22 64 30 52Z" fill="${hc}"/><path d="M78 40C98 58 94 94 78 98C84 80 78 64 70 52Z" fill="${hc}"/>`:'';
 const ears=v===2?`<path d="M26 28L24 6L44 18Z" fill="${hd}"/><path d="M74 28L76 6L56 18Z" fill="${hd}"/><path d="M28 24L28 12L38 18Z" fill="#ffb3d1"/><path d="M72 24L72 12L62 18Z" fill="#ffb3d1"/>`:'';
 const bow=v===0?`<path d="M62 20L78 12L78 30Z" fill="#ff5fa8"/><path d="M62 20L48 10L48 28Z" fill="#ff5fa8"/><circle cx="62" cy="20" r="4" fill="#ff2f87"/>`:'';
 return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="${bg}"/><path d="M14 22C5 15 8 8 13 9C14 9.5 14 10 14 11C14 10 15 9 17 9C22 8 23 15 14 22Z" fill="#ff4fd8" opacity=".9"/><circle cx="88" cy="30" r="2" fill="#fff" opacity=".8"/>${ears}<path d="M16 96C6 48 22 12 50 12S94 48 84 96Z" fill="${hd}"/>${tails}<path d="M28 100C30 84 40 80 50 80S70 84 72 100Z" fill="#fff"/><rect x="44" y="70" width="12" height="12" fill="#ffd9c8"/><path d="M44 82L50 92L56 82Z" fill="#ff5fa8"/><ellipse cx="50" cy="52" rx="24" ry="27" fill="#ffe4d6"/><path d="M24 52C20 22 38 12 50 12S80 22 76 52C70 38 62 30 50 30S30 38 24 52Z" fill="${hc}"/><ellipse cx="39" cy="56" rx="11" ry="13" fill="${ic}" opacity=".3"/><ellipse cx="39" cy="56" rx="6.5" ry="8.5" fill="${ic}"/><ellipse cx="61" cy="56" rx="11" ry="13" fill="${ic}" opacity=".3"/><ellipse cx="61" cy="56" rx="6.5" ry="8.5" fill="${ic}"/><ellipse cx="39" cy="57" rx="3" ry="5" fill="#2a1038"/><ellipse cx="61" cy="57" rx="3" ry="5" fill="#2a1038"/><circle cx="37" cy="52.5" r="2.4" fill="#fff"/><circle cx="59" cy="52.5" r="2.4" fill="#fff"/><circle cx="41" cy="61" r="1.2" fill="#fff"/><circle cx="63" cy="61" r="1.2" fill="#fff"/><path d="M31 49Q39 44 46 49M54 49Q61 44 69 49" stroke="#2a1038" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="32" cy="65" rx="5" ry="3" fill="#ff8fb8" opacity=".55"/><ellipse cx="68" cy="65" rx="5" ry="3" fill="#ff8fb8" opacity=".55"/><path d="M46 70Q50 74 54 70" stroke="#c23a6b" stroke-width="1.6" fill="none" stroke-linecap="round"/>${bow}</svg>`};
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
const SRC={
  sc:{n:'SoundCloud',c:'var(--sc)',note:'скоро',soon:true},
  au:{n:'Audius',c:'var(--au)',note:'без реклами'},
  ja:{n:'Jamendo',c:'var(--ja)',note:'без реклами'}
};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hs=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h%360};
const key=t=>t.s+':'+t.id;
const reg=new Map();
const covIn=t=>girl(hs(key(t)))+(t.img?`<img src="${esc(t.img)}" alt="" loading="lazy" onerror="this.remove()">`:'');
const cov=t=>`<span class="cov">${covIn(t)}</span>`;
const HEART_ON='<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:currentColor"><path d="M12 20s-7-4.6-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.4-7 10-7 10z"/></svg>';
const HEART_OFF='<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.4-7 10-7 10z"/></svg>';

let tab='search',q='',on={sc:false,au:true,ja:true};
let results=[],notes=[],loading=false,seq=0;
let cur=null,started=false,playing=false,queue=[];
let favs=[];try{favs=JSON.parse(localStorage.getItem('hv_favs')||'[]')}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('hv_favs',JSON.stringify(favs))}catch(e){}};
const isFav=t=>favs.some(x=>key(x)===key(t));
const isCur=t=>started&&cur&&key(cur)===key(t);

function toast(m){
  const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);
  setTimeout(()=>d.remove(),2600);
}

/* ---------- джерела ---------- */
let auHost=null;
async function audiusHost(){
  if(auHost)return auHost;
  const j=await (await fetch('https://api.audius.co')).json();
  auHost=j.data[0];return auHost;
}
async function audius(query){
  try{
    const h=await audiusHost();
    const u=query?`${h}/v1/tracks/search?query=${encodeURIComponent(query)}&limit=20&app_name=Hvylia`:`${h}/v1/tracks/trending?limit=20&app_name=Hvylia`;
    const j=await (await fetch(u)).json();
    return (j.data||[]).filter(x=>x.is_streamable!==false).map(x=>({s:'au',id:x.id,t:x.title,a:(x.user&&x.user.name)||'',d:x.duration||0,img:x.artwork?(x.artwork['150x150']||x.artwork['480x480']||''):''}));
  }catch(e){auHost=null;throw e}
}
async function jamendo(query){
  const k=(window.HVYLIA||{}).JAMENDO_KEY;
  if(!k)throw new Error('nokey');
  const u=`https://api.jamendo.com/v3.0/tracks/?client_id=${encodeURIComponent(k)}&format=json&limit=20&audioformat=mp32&imagesize=100&`+(query?`search=${encodeURIComponent(query)}`:'order=popularity_week');
  const j=await (await fetch(u)).json();
  return (j.results||[]).filter(x=>x.audio).map(x=>({s:'ja',id:x.id,t:x.name,a:x.artist_name,d:+x.duration||0,img:x.image||'',url:x.audio}));
}
function interleave(parts){
  const out=[],n=Math.max(0,...parts.map(p=>p.length));
  for(let i=0;i<n;i++)parts.forEach(p=>{if(p[i])out.push(p[i])});
  return out;
}
async function doSearch(){
  const my=++seq;loading=true;paintRes();
  const errs=[],jobs=[];
  if(on.au)jobs.push(audius(q).catch(()=>{errs.push('Audius зараз недоступний');return[]}));
  if(on.ja)jobs.push(jamendo(q).catch(e=>{errs.push(e.message==='nokey'?'Jamendo: не вказано ключ (див. README)':'Jamendo зараз недоступний');return[]}));
  const parts=await Promise.all(jobs);
  if(my!==seq)return;
  results=interleave(parts);notes=errs;loading=false;paintRes();
}
let deb=null;

/* ---------- рендер ---------- */
function row(t,opt={}){
  reg.set(key(t),t);
  const s=SRC[t.s],k=esc(key(t)),f=isFav(t),inQ=queue.some(x=>key(x)===key(t));
  return `<div class="row${isCur(t)?' on':''}" style="--c:${s.c}">
    <button class="main" data-play="${k}">${cov(t)}
    <span class="meta"><b>${esc(t.t)}</b><span>${esc(t.a)}, ${s.n}</span></span><span class="dur">${t.d?fmt(t.d):''}</span></button>
    <button class="add fav${f?' done':''}" data-fav="${k}" aria-label="${f?'Прибрати з улюбленого':'В улюблене'}">${f?HEART_ON:HEART_OFF}</button>
    ${opt.add?`<button class="add${inQ?' done':''}" data-add="${k}" aria-label="${inQ?'Уже в черзі':'Додати в чергу'}"><svg viewBox="0 0 24 24">${inQ?'<path d="M5 12l5 5 9-10"/>':'<path d="M12 5v14M5 12h14"/>'}</svg></button>`:''}
  </div>`;
}
function paintRes(){
  const el=$('res');if(!el||tab!=='search')return;
  const n=$('note');if(n)n.textContent=notes.join('. ');
  el.innerHTML=loading?'<div class="empty">Шукаю…</div>':results.length?results.map(t=>row(t,{add:true})).join(''):'<div class="empty" id="emp"></div>';
  const e=$('emp');if(e)e.textContent=q?`Нічого не знайдено за запитом «${q}». Спробуйте іншу назву.`:'Увімкніть Audius або Jamendo, щоб побачити треки.';
}
function render(){
  const el=$('screen');
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));
  if(tab==='search'){
    el.innerHTML=`<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Трек, артист або альбом"></div>
      <div class="chips">${Object.keys(SRC).map(k=>`<button class="chip${SRC[k].soon?' soon':''}" style="--c:${SRC[k].c}" data-src="${k}" aria-pressed="${!!on[k]}"><i></i>${SRC[k].n}${SRC[k].soon?' · скоро':''}</button>`).join('')}</div>
      <p class="hint">Один пошук по всіх сервісах. Колір смужки показує джерело. <span id="note"></span></p>
      <div class="list" id="res"></div>`;
    $('q').value=q;
    $('q').addEventListener('input',ev=>{q=ev.target.value;clearTimeout(deb);deb=setTimeout(doSearch,450)});
    paintRes();
  }else if(tab==='queue'){
    const next=queue.filter(t=>!isCur(t));
    el.innerHTML=`<div class="sec">Зараз грає</div><div class="list">${started?row(cur):'<div class="empty">Оберіть трек у пошуку, і він зʼявиться тут.</div>'}</div>
      <div class="sec">Далі в черзі</div><div class="list">${next.length?next.map(t=>row(t)).join(''):'<div class="empty">Черга порожня. Додайте треки кнопкою «+» у пошуку.</div>'}</div>`;
  }else{
    el.innerHTML=`<div class="sec">Ваші збірки</div><div class="jps" style="padding:0 20px 10px;margin:0">プレイリスト</div>`+
      (favs.length?`<button class="pl" data-pl="fav">${cov(favs[0])}
        <span class="meta"><b>Улюблене</b><span>${favs.length} треків</span>
        <span class="srcs">${[...new Set(favs.map(t=>t.s))].map(s=>`<i style="--c:${SRC[s].c}" title="${SRC[s].n}"></i>`).join('')}</span></span></button>
        <div class="list">${favs.map(t=>row(t)).join('')}</div>`
      :'<div class="empty">Тут зʼявляться треки, які ви позначите сердечком.</div>')+
      `<p class="hint" style="padding:10px 20px">Audius і Jamendo безкоштовні й без реклами. SoundCloud без реклами тільки з платною підпискою.</p>`;
  }
}
const refresh=()=>tab==='search'?paintRes():render();

/* ---------- плеєр ---------- */
const au=new Audio();au.preload='auto';
const dur=()=>isFinite(au.duration)&&au.duration>0?au.duration:(cur&&cur.d)||0;
function paintPlayer(){
  $('mini').style.display=started?'flex':'none';
  if(started&&cur){
    const t=cur;
    [$('miniCov'),$('bigCov')].forEach(c=>c.innerHTML=covIn(t));
    $('miniT').textContent=t.t;$('miniA').textContent=t.a;
    $('fT').textContent=t.t;$('fA').textContent=t.a;$('fS').textContent=SRC[t.s].n+', '+SRC[t.s].note;
    $('fDot').parentNode.style.setProperty('--c',SRC[t.s].c);
  }
  $('miniPlay').innerHTML=$('fPlay').innerHTML=playing?PAUSE:PLAY;
  $('miniDisc').classList.toggle('spin',playing);$('bigDisc').classList.toggle('spin',playing);
  paintTime();
}
function paintTime(){
  const d=dur(),p=au.currentTime||0;
  $('seek').max=d;$('seek').value=p;$('tNow').textContent=fmt(p);$('tEnd').textContent=fmt(d);
  $('mbar').style.width=(d?p/d*100:0)+'%';
}
let pt=0;
async function play(t){
  cur=t;started=true;playing=true;const my=++pt;
  if(!queue.some(x=>key(x)===key(t)))queue.unshift(t);
  paintPlayer();refresh();
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:t.t,artist:t.a,artwork:t.img?[{src:t.img}]:[]});
  }
  try{
    const src=t.s==='au'?`${await audiusHost()}/v1/tracks/${encodeURIComponent(t.id)}/stream?app_name=Hvylia`:t.url;
    if(my!==pt)return;
    au.src=src;await au.play();
  }catch(e){
    if(my===pt){playing=false;paintPlayer();toast('Не вдалося відтворити цей трек')}
  }
}
function step(d){
  if(!queue.length)return;
  const k=queue.findIndex(x=>cur&&key(x)===key(cur));
  play(queue[(k+d+queue.length)%queue.length]);
}
function toggle(){
  if(!started)return;
  if(au.paused)au.play().catch(()=>{});else au.pause();
}
au.onplaying=()=>{playing=true;paintPlayer()};
au.onpause=()=>{if(!au.ended){playing=false;paintPlayer()}};
au.ontimeupdate=paintTime;
au.onloadedmetadata=paintTime;
au.onended=()=>step(1);
au.onerror=()=>{if(au.src){playing=false;paintPlayer();toast('Не вдалося завантажити трек')}};
if('mediaSession' in navigator){
  const ms=navigator.mediaSession;
  ms.setActionHandler('play',()=>au.play());
  ms.setActionHandler('pause',()=>au.pause());
  ms.setActionHandler('nexttrack',()=>step(1));
  ms.setActionHandler('previoustrack',()=>step(-1));
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.play!==undefined){
    const t=reg.get(d.play);if(!t)return;
    if(tab==='search')queue=results.slice();
    else if(tab==='lib')queue=favs.slice();
    play(t);
  }else if(d.fav!==undefined){
    const t=reg.get(d.fav);if(!t)return;
    if(isFav(t))favs=favs.filter(x=>key(x)!==key(t));else favs.push(t);
    saveFavs();refresh();
  }else if(d.add!==undefined){
    const t=reg.get(d.add);if(t&&!queue.some(x=>key(x)===key(t)))queue.push(t);refresh();
  }else if(d.src){
    if(SRC[d.src].soon){toast('SoundCloud додамо пізніше');return}
    on[d.src]=!on[d.src];render();doSearch();
  }else if(d.pl!==undefined){
    if(favs.length){queue=favs.slice();play(queue[0]);tab='queue';render()}
  }else if(d.tab){tab=d.tab;render();scrollTo(0,0)}
});
$('miniPlay').onclick=$('fPlay').onclick=toggle;
$('miniTap').onclick=()=>$('full').classList.add('open');
$('close').onclick=()=>$('full').classList.remove('open');
$('next').onclick=()=>step(1);
$('prev').onclick=()=>{if(au.currentTime>3){au.currentTime=0}else step(-1)};
$('seek').oninput=e=>{au.currentTime=+e.target.value};
$('mascot').innerHTML=girl(340);
paintPlayer();render();doSearch();
</script>
</body>
</html>
